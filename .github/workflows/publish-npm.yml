name: publish-npm

# 把 Linux x64 server CLI 二进制发到 npm（包名 loongcode）。
# 自包含单包：二进制直接打进包，不用 optionalDependencies 平台子包。
# 因此只支持 Linux x64（glibc）——覆盖绝大多数服务器。arm64/musl 走 Releases 下载。
#
# 需要 secret: NPM_TOKEN（npm publish token，存仓库 secret）
# 注：之前用 loongcode-ai 被 unpublish 进 24h 冷却，改用可用的 loongcode。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: github.repository == 'Calendula597/LoongCode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Read version from package.json
        id: version
        run: |
          v=$(node -p "require('./packages/loongcode/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将使用版本: $v"

      - uses: ./.github/actions/setup-bun

      - name: Install deps
        # hoisted linker：规避 isolated linker 在变体符号链接目录上的解析 bug（EISDIR @babel/traverse）
        run: bun install --linker hoisted

      - name: Build Linux x64 binary
        env:
          LOONGCODE_VERSION: ${{ steps.version.outputs.version }}
          LOONGCODE_CHANNEL: latest
        # 编译当前平台（x64 Linux runner）的单文件二进制；不需要 release 上传
        run: ./packages/loongcode/script/build.ts --single

      - name: Verify binary
        run: |
          B=packages/loongcode/dist/loongcode-linux-x64/bin/loongcode
          ls -lh "$B"
          "$B" --version

      - name: Setup Node for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack & publish loongcode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        working-directory: packages/loongcode/dist/loongcode-linux-x64
        run: |
          # 拷贝 LICENSE 到打包目录
          cp "$GITHUB_WORKSPACE/LICENSE" .
          # 用 node 写自包含 package.json：bin 直接指向包内二进制
          node -e 'const fs=require("fs");fs.writeFileSync("package.json",JSON.stringify({name:"loongcode",version:process.env.PKG_VERSION,description:"LoongCode — headless server CLI (Linux x64 build)",license:"MIT",os:["linux"],cpu:["x64"],bin:{loongcode:"./bin/loongcode"},files:["bin/loongcode","LICENSE"]},null,2)+"\n")'
          cat package.json
          npm publish --access public
