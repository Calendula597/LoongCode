name: build-desktop-win-arm64

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: false
        type: choice
        default: prod
        options:
          - prod
          - beta
          - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./packages/loongcode/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将使用版本: $v"

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Package
        run: npx electron-builder --win --arm64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-desktop-win-arm64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: ignore

      - name: Upload to Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/desktop/dist
        # 只传 exe 安装包；.blockmap 是增量更新索引，按需可去掉。
        run: gh release upload "v${{ steps.version.outputs.version }}" *.exe --clobber --repo "$GH_REPO" || echo "(无文件或上传失败，看上面日志)"
