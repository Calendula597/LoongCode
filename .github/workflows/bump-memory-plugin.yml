name: Bump opencode-mem version

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at 00:00 UTC
  workflow_dispatch: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: oven-sh/setup-bun@v2

      - name: Bump version
        id: bump
        run: bun script/bump-memory-plugin.ts

      - name: Create Pull Request
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump opencode-mem to ${{ steps.bump.outputs.version }}"
          title: "chore: bump opencode-mem to ${{ steps.bump.outputs.version }}"
          body: "Automated weekly bump of the built-in memory plugin version."
          branch: bump-opencode-mem-${{ steps.bump.outputs.version }}
          base: dev
