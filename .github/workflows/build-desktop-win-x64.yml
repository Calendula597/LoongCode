name: build-desktop-win-x64

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: false
        type: choice
        default: prod
        options:
          - prod
          - beta
          - dev
      version:
        description: "Release 版本号 (如 0.0.1)，留空则只产 artifact 不上传 Release"
        required: false
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Package
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: ignore

      - name: Upload to Release
        if: inputs.version != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/desktop/dist
        run: |
          gh release upload "v${{ inputs.version }}" *.exe *.blockmap \
            --clobber --repo "$GH_REPO" || echo "(无文件或上传失败，看上面日志)"
