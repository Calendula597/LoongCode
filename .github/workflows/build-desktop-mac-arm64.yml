name: build-desktop-mac-arm64

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: false
        type: choice
        default: prod
        options:
          - prod
          - beta
          - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./packages/loongcode/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将使用版本: $v"

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Package
        run: npx electron-builder --mac --arm64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-desktop-mac-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: ignore

      - name: Upload to Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/desktop/dist
        # 传 dmg 安装包 + latest*.yml（electron-updater 检查更新需要）
        run: gh release upload "v${{ steps.version.outputs.version }}" *.dmg latest*.yml --clobber --repo "$GH_REPO" || echo "(无文件或上传失败，看上面日志)"

      - name: Add macOS install note to Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # 应用未签名/未公证，在 Release 说明里注明 xattr 去隔离命令
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## macOS 安装说明 / Installation Notes

          本应用未进行 Apple 签名和公证。首次打开时 macOS 可能提示“已损坏，无法打开”（"is damaged and can't be opened"），这是 Gatekeeper 对未签名应用的拦截，应用本身没有问题。

          安装后在终端执行一次以下命令即可正常打开：

          ```bash
          sudo xattr -rd com.apple.quarantine /Applications/Loongcode.app
          ```

          This app is not signed or notarized by Apple. If macOS reports it "is damaged and can't be opened" on first launch, run the command above once to remove the quarantine attribute.
          EOF
          gh release edit "v${{ steps.version.outputs.version }}" --notes-file /tmp/release-notes.md --repo "$GH_REPO" || echo "(notes 更新失败，看上面日志)"
