name: build-server-binary

on:
  workflow_dispatch:

# 只在本仓库跑，避免被 fork 误触发
permissions:
  contents: write   # gh release create/upload 需要

concurrency:
  group: build-server-binary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'Calendula597/LoongCode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Read version from package.json
        id: version
        run: |
          v=$(node -p "require('./packages/loongcode/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将使用版本: $v"

      - uses: ./.github/actions/setup-bun

      - name: Install deps
        # hoisted linker：规避 isolated linker 在变体符号链接目录上的解析 bug（EISDIR @babel/traverse）
        run: bun install --linker hoisted

      - name: Create release (if missing)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # build.ts 在 LOONGCODE_RELEASE=1 时会自己 gh release upload，
          # 需要 release 先存在，所以在 build 之前创建。
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "LoongCode v${{ steps.version.outputs.version }} — server binary builds (Linux x64/arm64)" \
            --repo "$GH_REPO" || true

      - name: Build all binaries
        env:
          LOONGCODE_VERSION: ${{ steps.version.outputs.version }}
          LOONGCODE_RELEASE: "1"
          LOONGCODE_CHANNEL: latest
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # 只编译 Linux 6 个目标（server 模式只在 Linux 服务器跑，darwin/windows server 二进制用不到）
        run: ./packages/loongcode/script/build.ts --target=loongcode-linux-x64,loongcode-linux-x64-baseline,loongcode-linux-arm64,loongcode-linux-x64-musl,loongcode-linux-arm64-musl,loongcode-linux-x64-baseline-musl

      - name: List Linux tarballs
        if: always()
        run: ls -lh packages/loongcode/dist/*.tar.gz || echo "无 tarball"

      - name: Upload Linux tarballs to release (兜底)
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            packages/loongcode/dist/loongcode-linux-*.tar.gz \
            --clobber --repo "$GH_REPO" || echo "upload 兜底也失败，看上面日志"

      - name: Upload artifacts (release 拿不到时从这下)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-linux-binaries
          path: packages/loongcode/dist/loongcode-linux-*.tar.gz
          retention-days: 30
          if-no-files-found: warn
