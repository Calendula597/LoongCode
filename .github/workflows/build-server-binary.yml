name: build-server-binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.0.1)"
        required: true
        default: "0.0.1"

# 只在本仓库跑，避免被 fork 误触发
permissions:
  contents: write   # gh release create/upload 需要

concurrency:
  group: build-server-binary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'Clearlove7Zz/LoongCode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Install deps
        run: bun install

      - name: Build all binaries
        env:
          LOONGCODE_VERSION: ${{ inputs.version }}
          LOONGCODE_RELEASE: "1"
          LOONGCODE_CHANNEL: latest
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./packages/loongcode/script/build.ts

      - name: List Linux tarballs
        run: ls -lh packages/loongcode/dist/*.tar.gz

      - name: Create release (if missing)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "LoongCode v${{ inputs.version }} — server binary builds (Linux x64/arm64)" \
            --repo "$GH_REPO" || true

      - name: Upload Linux tarballs to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            packages/loongcode/dist/loongcode-linux-*.tar.gz \
            --clobber --repo "$GH_REPO"

      - name: Upload artifacts (备用，release 拿不到时从这下)
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-linux-binaries
          path: packages/loongcode/dist/loongcode-linux-*.tar.gz
          retention-days: 30
