name: build-desktop-windows

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: false
        type: choice
        default: prod
        options:
          - prod
          - beta
          - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    if: github.repository == 'Clearlove7Zz/LoongCode'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./packages/loongcode/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "将使用版本: $v"

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Package (x64 + arm64 一次出双架构，生成单一含两架构的 latest.yml)
        run: npx electron-builder --win --x64 --arm64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          LOONGCODE_CHANNEL: ${{ inputs.channel }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongcode-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: ignore

      - name: Upload to Release
        if: ${{ true }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/desktop/dist
        # 传双架构 exe + 单个 latest.yml（含 x64 和 arm64 两架构，electron-updater 据此找匹配架构）
        run: gh release upload "v${{ steps.version.outputs.version }}" *.exe latest.yml --clobber --repo "$GH_REPO" || echo "(无文件或上传失败，看上面日志)"
