version: '1.0'
name: build-server-binary
displayName: Build Server Binary
triggers:
  push:
    branches:
      include:
        - loongcode
stages:
  - name: compile
    displayName: 编译
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_server_binary
        displayName: Nodejs 构建
        nodeVersion: 24.0.0
        commands:
          - node -v
          - npm -v
          # 安装 Bun
          - V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          - curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-linux-x64.zip" -o bun.zip
          - unzip -o bun.zip -d /usr/local/bin
          - export PATH="/usr/local/bin:$PATH"
          - bun --version
          # 安装依赖
          - bun install --linker hoisted
          # 读取版本号
          - v=$(node -p "require('./packages/loongcode/package.json').version")
          - echo "LOONGCODE_VERSION=$v" >> $GITEE_PIPELINE_ENV
          # 构建所有 Linux 二进制
          - LOONGCODE_VERSION=$v LOONGCODE_CHANNEL=latest ./packages/loongcode/script/build.ts --target=loongcode-linux-x64,loongcode-linux-x64-baseline
          # 列出产物
          - ls -lh packages/loongcode/dist/*.tar.gz || echo "无 tarball"
        artifacts:
          - name: SERVER_BINARY
            path:
              - packages/loongcode/dist/loongcode-linux-*.tar.gz